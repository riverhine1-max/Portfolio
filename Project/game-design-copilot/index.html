<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Game Design Copilot</title>
    <meta name="description" content="A friendly game design copilot with Ludomuse, a free AI that runs on your device. No account, no key." />
    <meta name="theme-color" content="#0b1510" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Copilot" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="./main.css" />
    <style>
      /* Loading screen: plain HTML/CSS so it appears before the app's code loads. */
      #splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden;
        background: radial-gradient(900px 520px at 50% 42%, #173d2c 0%, #0b1510 62%, #070c09 100%); color: #f3eee4;
        font-family: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif; transition: opacity .45s ease, visibility .45s; }
      #splash.done { opacity: 0; visibility: hidden; }
      #splash .sp-grid { position: absolute; inset: -40px; opacity: .10; pointer-events: none;
        background-image: linear-gradient(#f3eee4 1px, transparent 1px), linear-gradient(90deg, #f3eee4 1px, transparent 1px);
        background-size: 44px 44px; mask-image: radial-gradient(circle at 50% 45%, #000 0, transparent 60%); -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0, transparent 60%);
        animation: sp-drift 8s linear infinite; }
      @keyframes sp-drift { to { transform: translate(44px, 44px); } }
      #splash .sp-core { position: relative; display: grid; justify-items: center; gap: 18px; text-align: center; padding: 24px; }
      #splash svg { width: 132px; height: 132px; overflow: visible; filter: drop-shadow(0 14px 40px rgba(233, 195, 124, .18)); }
      #splash .hex { stroke-dasharray: 900; stroke-dashoffset: 900; animation: sp-draw 1.1s cubic-bezier(.6, 0, .2, 1) .1s forwards; }
      #splash .tri { stroke-dasharray: 520; stroke-dashoffset: 520; animation: sp-draw .8s cubic-bezier(.6, 0, .2, 1) .55s forwards; }
      #splash .facets { opacity: 0; animation: sp-fade .6s ease .9s forwards; }
      #splash .spark { transform-origin: 256px 266px; transform: scale(0) rotate(-45deg); animation: sp-spark .7s cubic-bezier(.3, 1.6, .5, 1) 1s forwards, sp-pulse 2.4s ease-in-out 1.8s infinite; }
      #splash .glow { opacity: 0; animation: sp-fade 1s ease 1s forwards; }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-fade { to { opacity: 1; } }
      @keyframes sp-spark { to { transform: scale(1) rotate(0); } }
      @keyframes sp-pulse { 50% { transform: scale(1.08) rotate(8deg); } }
      #splash h1 { margin: 0; font-size: clamp(26px, 5vw, 38px); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; opacity: 0; transform: translateY(8px); animation: sp-up .6s ease .7s forwards; }
      #splash .sp-by { margin: -8px 0 0; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #e9c37c; opacity: 0; animation: sp-up .6s ease .9s forwards; }
      #splash .sp-bar { width: 180px; height: 3px; border-radius: 3px; background: rgba(243, 238, 228, .12); overflow: hidden; opacity: 0; animation: sp-fade .4s ease 1s forwards; }
      #splash .sp-bar i { display: block; height: 100%; width: 40%; border-radius: inherit; background: linear-gradient(90deg, transparent, #e9c37c, #74c79c, transparent); animation: sp-slide 1.3s ease-in-out infinite; }
      @keyframes sp-slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      #splash .sp-line { min-height: 1.4em; margin: 0; font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif; font-size: 14px; color: rgba(243, 238, 228, .62); opacity: 0; animation: sp-fade .4s ease 1.1s forwards; }
      @keyframes sp-up { to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash .sp-grid { animation: none !important; opacity: 1 !important; transform: none !important; stroke-dashoffset: 0 !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Game Design Copilot">
      <div class="sp-grid" aria-hidden="true"></div>
      <div class="sp-core">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <defs><radialGradient id="sp-glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e9c37c" stop-opacity=".5" /><stop offset="1" stop-color="#e9c37c" stop-opacity="0" /></radialGradient></defs>
          <circle class="glow" cx="256" cy="268" r="150" fill="url(#sp-glow)" />
          <path class="hex" d="M256 112 L385.9 187 L385.9 337 L256 412 L126.1 337 L126.1 187 Z" fill="none" stroke="#f3eee4" stroke-width="20" stroke-linejoin="round" />
          <path class="tri" d="M256 170 L343 322 L169 322 Z" fill="none" stroke="#f3eee4" stroke-opacity=".55" stroke-width="10" stroke-linejoin="round" />
          <path class="facets" d="M256 112 L256 170 M385.9 337 L343 322 M126.1 337 L169 322 M169 322 L256 412 L343 322 M126.1 187 L256 170 L385.9 187 M126.1 187 L169 322 M385.9 187 L343 322" fill="none" stroke="#f3eee4" stroke-opacity=".25" stroke-width="6" stroke-linecap="round" />
          <path class="spark" d="M256 208 C261 247 274 259 312 266 C274 273 261 285 256 324 C251 285 238 273 200 266 C238 259 251 247 256 208 Z" fill="#e9c37c" />
        </svg>
        <h1>Game Design Copilot</h1>
        <p class="sp-by">with Ludomuse</p>
        <div class="sp-bar" aria-hidden="true"><i></i></div>
        <p class="sp-line" id="splash-line">Waking up Ludomuse…</p>
      </div>
    </div>
    <script>
      (function () {
        window.__splashStart = Date.now();
        var lines = ["Waking up Ludomuse…", "Opening your notes…", "Shuffling the design dice…", "Sharpening pencils…"];
        var i = 0, el = document.getElementById("splash-line");
        window.__splashTimer = setInterval(function () { i = (i + 1) % lines.length; if (el) el.textContent = lines[i]; }, 900);
      })();
    </script>
    <div id="root"></div>
    <noscript>This app needs JavaScript turned on.</noscript>
    <script type="module" src="./main.js"></script>
  </body>
</html>
